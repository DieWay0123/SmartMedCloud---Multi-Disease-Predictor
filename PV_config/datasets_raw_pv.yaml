apiVersion: v1
kind: PersistentVolume
metadata:
  name: datasets-raw-pv
spec:
  storageClassName: ""
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: kubeflow-user-example-com
    name: datasets-raw-pvc
  nfs:
    path: /srv/nfs/datasets_raw
    server: 10.11.12.2